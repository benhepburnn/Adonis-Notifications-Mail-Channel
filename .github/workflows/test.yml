name: test

on:
  - push
  - pull_request

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        adonis: [6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
      - name: Install AdonisJS v7 dependencies
        if: matrix.adonis == 7
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Install AdonisJS v6 dependencies
        if: matrix.adonis == 6
        run: pnpm add --save-dev --strict-peer-dependencies @adonisjs/core@6.21.0 @adonisjs/mail@9.2.2 @benhepburn/adonis-notifications@1.1.0
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
